plugins {
    // 26.1+ is unobfuscated: the NEW non-remapping Loom plugin id (net.fabricmc.fabric-loom),
    // NOT the old remapping 'fabric-loom'. Requires Loom >=1.15, Gradle >=9.4.
    // (House recipe proven on DejaView/Blockives; 1.17.19 is the newest stable line.)
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The Fabric port carries its loader in the version metadata alongside the MC line, so
// every jar in the multi-loader release is distinguishable at a glance:
// packwork-1.0.0+mc26.1-fabric.jar. (NeoForge port branches: packwork-1.0.0+mc<ver>.jar.)
version = "${mod_version}+mc${minecraft_version}-fabric"
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    exclude("**/*.bbmodel")
}

repositories {
    // Loom registers the Fabric maven automatically. Extra repos are for the OPTIONAL
    // integrations only - every one is a soft dep, gated at runtime.
    maven { url = 'https://maven.blamejared.com' }        // JEI (fabric builds, same version line)
    maven { url = 'https://maven.nucleoid.xyz/releases' } // Trinkets Updated (eu.pb4:trinkets)
}

// Mojang ships Java 25 to end users from 26.1, so mods target Java 25 (same as the
// NeoForge 26.x branches). The foojay resolver in settings.gradle provisions the JDK;
// gradle/gradle-daemon-jvm.properties keeps the DAEMON on 25+ (Loom requires it for 26.x).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // MC 26.1+ ships unobfuscated -> NO mappings line, NO remapping; deps are plain
    // implementation (no modImplementation / remapJar in the non-remapping plugin).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Team Reborn Energy - the Fabric ecosystem's de facto energy standard, designed to be
    // jar-in-jar bundled (its own README says `include`). This is the Fabric idiom of
    // "standard capabilities first": the Charge Crystal gets an automation face any Fabric
    // tech mod can talk to, and the tiny API rides inside our jar so it is NOT a content
    // dep the player installs. The FE-equivalent store stays component-identical.
    implementation "teamreborn:energy:${energy_version}"
    include "teamreborn:energy:${energy_version}"

    // --- Optional integrations (all SOFT deps) ---------------------------------
    // compileOnly the API so the one gated compat class per mod compiles; runtime
    // inclusion is opt-in per flag so the DEFAULT build/run/tests stay dependency-free
    // and the "none present" invariant is real. Combined: ./gradlew runGametest -Ptrinkets -Pjei

    // JEI - recipe/usage lookup. Same version line as the NeoForge 26.1 branch.
    compileOnly "mezz.jei:jei-${minecraft_version_full}-fabric-api:${jei_version}"
    if (project.hasProperty('jei')) {
        runtimeOnly "mezz.jei:jei-${minecraft_version_full}-fabric:${jei_version}"
    }

    // Trinkets (Updated) - the Fabric wear-slot standard on 26.x (the original Trinkets and
    // Accessories both end at 1.21.x; Patbox's maintained fork carries the ecosystem).
    compileOnly "eu.pb4:trinkets:${trinkets_version}"
    if (project.hasProperty('trinkets')) {
        runtimeOnly "eu.pb4:trinkets:${trinkets_version}"
    }

    // Mekanism / Forgework: NeoForge-only mods - no Fabric artifact exists, so the gas
    // store and the Flux bridge simply have no gate to light here. Their compat classes
    // do not exist on this branch (see DECISIONS.md).
}

loom {
    // ShapedRecipe.pattern is private in pure vanilla; the class tweaker (successor of the
    // access widener - same key in fabric.mod.json) opens it for arrangeOn3x3's shaped grid.
    accessWidenerPath = file('src/main/resources/packwork.classtweaker')

    runs {
        client {
            client()
            name = 'Packwork Client'
            // Dev visual harness: ./gradlew runClient -Pautoshot boots a throwaway world,
            // fills and opens a pack, and writes screenshots to run/screenshots.
            if (project.hasProperty('autoshot')) {
                property 'packwork.autoshot', '1'
            }
            if (project.hasProperty('gallery')) {
                property 'packwork.gallery', '1'
            }
            // Worn-render shoot: ./gradlew runClient -Pwornshot -Ptrinkets - equips packs in
            // the Trinkets back slot and screenshots the third-person back view (tiers,
            // chestplate, crouch, elytra-hides) so the layer is verified as pixels.
            if (project.hasProperty('wornshot')) {
                property 'packwork.wornshot', '1'
            }
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            name = 'Packwork Server'
            programArgs '--nogui'
        }
        // The gametest runner: a dedicated server that runs every registered test then
        // exits nonzero on failure (fabric-api's game-test module picks up the vanilla
        // 26.x registry-based tests packwork registers at init).
        gametest {
            server()
            name = 'Packwork GameTests'
            property 'fabric-api.gametest', 'true'
        }
    }
}

// Captured as a plain String so the closure below stays configuration-cache safe.
def modVersionString = version.toString()
processResources {
    inputs.property 'version', modVersionString
    filesMatching('fabric.mod.json') {
        expand 'version': modVersionString
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
