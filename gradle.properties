# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Fabric toolchain - every pin verified against a live source on 2026-08-13:
#   minecraft 26.2     : the 26.2 line (the mod declares "~26.2")
#   loom      1.17.19  : newest stable of the non-remapping net.fabricmc.fabric-loom
#   loader    0.19.3   : meta.fabricmc.net/v2/versions/loader (newest stable)
#   fabric    0.157.0  : newest fabric-api build for the 26.2 line (maven.fabricmc.net)
#   energy    5.0.0    : Team Reborn Energy for 26.1+ (maven.fabricmc.net; jar-in-jar'd)
minecraft_version=26.2
# The FULL patch version, used only to name version-suffixed artifacts (JEI's fabric
# artifact id is jei-26.2-fabric, matching the NeoForge branch's version line).
minecraft_version_full=26.2
loader_version=0.19.3
fabric_version=0.157.0+26.2
energy_version=5.0.0

# Optional-integration versions (all compileOnly + runtime-gated soft deps).
#   jei      30.20.0.154        : same version line as the NeoForge 26.2 branch (blamejared)
#   trinkets 4.1.0-beta.3+26.2  : Trinkets Updated (Patbox fork; the wear-slot standard on
#                                 26.x Fabric - original Trinkets and Accessories end at 1.21.x)
jei_version=30.20.0.154
trinkets_version=4.1.0-beta.3+26.2

## Mod Properties

mod_id=packwork
mod_name=Packwork
