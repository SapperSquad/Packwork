modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/SapperSquad/Packwork/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://github.com/SapperSquad/Packwork" #optional
logoFile="packwork_icon.png" #optional
authors="SapperSquad"

description='''
A humble adventurer's pack that holds far more than it should and quietly organizes itself.

Stamped leather tabs run down the side of the pack; items flow into premade or hand-made compartments the moment you drop them in. A rules engine claims each item for the right tab, manual pins always win, and a Loose tab catches anything no rule claims - so nothing ever vanishes. Tidy Up re-runs the whole sort, a stitched search bar finds anything across every tab, and a flatten toggle drops it all into one grid when you just want to rummage.

Leather and brass, never circuits. Later fittings let one pack carry fluids, arcane charge, bottled vapors, and soul-vialed XP - each a physical trinket you craft and install, never a tank-and-cable panel.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
